name: Frequent stock refresh

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-stock.yml"
      - "scripts/**"
      - "config/**"
  schedule:
    # Every 30 minutes, offset from the hour to reduce scheduler congestion.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b5-stock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data tools
        run: pip install pandas openpyxl

      - name: Download Google Sheet and build dashboard data
        env:
          STOCK_XLSX_URL: "https://docs.google.com/spreadsheets/d/1appOkfuCPuReEM63lS5RT3gWt2dD4HB-FGl2_h5Vhrw/export?format=xlsx"
        run: python scripts/build-data.py

      - name: Publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock.json
          if git diff --cached --quiet; then
            echo "No stock data changes"
          else
            git commit -m "Update stock data"
            git push
          fi
